##### Benchmarking [[google/benchmark](https://github.com/google/benchmark), [likwid](https://github.com/rrze-hpc/likwid), ...]
<!-- .element: style="text-align:left" -->

```cpp
/**
 * [+] iteration speed (isolation, simplicity)
 * [-] correlation (bias, noise, codgen, ...)
 */
auto bench(invocable auto code, integral auto samples, integral auto iterations) {
    vector<chrono::steady_clock::duration> stats(samples);
    for (auto s = 0u; s < samples; ++s) {                // statistics
        const auto start = chrono::steady_clock::now();  // perf counters
        for (auto i = 0u; i < iterations; ++i) {         // latency vs throughput
            keep(invoke(code));                          // optimizing compiler
        }
        const auto stop = chrono::steady_clock::now();
        stats[s] = (stop - start) / iterations;
    }
    return stats;
}
```

def explore(project, start, end):                                      # python
    state = project.factory.blank_state(addr=start)
    setup(state) # known data

    state.inspect.b("mem_read",  when=angr.BP_AFTER, action=on_mem_read)
    state.inspect.b("mem_write", when=angr.BP_AFTER, action=on_mem_write)

    simgr = project.factory.simulation_manager(state)
    simgr.explore(find=end)

    return simgr.found + simgr.active + simgr.deadended

```cpp
template<Level level>
auto refresh(const void* addr) {
    if constexpr (level == Level::L1) {
        load(addr);                              // L1d
        fence();
    } else if constexpr (level == Level::L2) {
        flush(addr);                             // DRAM
        fence();
        settle();
        prefetch<Level>(addr);                   // PREFETCHT1 hint
    } else if constexpr (level == Level::L3) {
        load(addr);                              // L1d
        demote(addr);                            // CLDEMOTE hint (Xeon, ...)
    } else {
        flush(addr);                             // DRAM
        fence();
    }
    settle();
}
```

```cpp
find (scan - if/else)  → branch
find (map  - hash map) → branch/cache
find (ph   - pext + cmov + lookup table) → cache
find (mph  - hash table in a register)
find (simd - N at the same time)
```

https://github.com/qlibs/mph
<!-- .element: style="text-align:left; font-size:16px;" -->

```cpp
g++-16     -std=c++26 -O3 -mbmi2 -c find.cpp -o find_gcc.o
clang++-22 -std=c++26 -O3 -mbmi2 -c find.cpp -o find_clang.o
```
<!-- .element: style="text-align:left; font-size:20px;" -->

```cpp
auto find_scan(const string_like auto symbol) noexcept:
  mov edx, [rcx + rax*8]
  cmp rdx, rdi
  jne .Lnext
```
<!-- .element: style="text-align:left; font-size:20px;" -->

```cpp
auto find_mph(const string_like auto symbol) noexcept:
  pext edi, edi, eax
  mov  eax, [rax + rdi*4]
```

```python
import perf                                                    # python

real  = { "branch": "unpredictable", "cache": "warm" }
best  = { ... }
worst = { ... }

for cxx in ("g++-16", "clang++-22"):
    for func in ("scan", "map", "ph", "mph", "simd"):
        for config in (best, real, worst):
            perf.bench(
                exec=f"find_{cxx}.o",
                func=func,
                mode="latency",
                event=["cycles", "instructions"],
                config=config,
            )
